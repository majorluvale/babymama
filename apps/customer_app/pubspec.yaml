name: babymama
description: Babymama - pre-loved fashion marketplace in Nairobi (web, Android, iOS).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  babymama_core:
    path: ../../packages/babymama_core
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
