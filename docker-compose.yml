services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: babymama
      POSTGRES_PASSWORD: babymama
      POSTGRES_DB: babymama
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://babymama:babymama@db:5432/babymama?schema=public
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
